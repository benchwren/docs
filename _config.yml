  benchwren.com: https://benchwren.com/

footer_content: >-
  © 2026 Benchwren. Benchwren apps are independent and are not made or endorsed by the platforms they extend.
  Atlassian and Jira are trademarks of Atlassian Pty Ltd.

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
