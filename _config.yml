title: Benchwren Docs
description: Small, focused apps for the tools your team already uses.
url: https://docs.benchwren.com
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
